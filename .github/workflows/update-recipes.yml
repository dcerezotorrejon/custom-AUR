name: Update PKGBUILD recipes

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  pages: write

jobs:
  update-recipes:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed git pacman-contrib nvchecker python jq curl github-cli
          useradd --create-home builder

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare permissions
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          chown -R builder:builder "$GITHUB_WORKSPACE"

          runuser -u builder -- git config --global user.name "github-actions[bot]"
          runuser -u builder -- git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check upstream, update PKGBUILDs & create PRs
        env:
          # Usamos el PAT guardado para que las PRs abran automáticamente los checks derivados (Namcap)
          GH_TOKEN: ${{ secrets.AUTO_PR_TOKEN }}
        run: |
          set -Eeuo pipefail

          [ -f oldver.json ] || echo '{}' > oldver.json
          nvchecker -c nvchecker.toml || true

          runuser -u builder -- python3 ./.scripts/check-updates.py
          runuser -u builder -- git clean -fxd ./