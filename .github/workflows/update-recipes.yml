name: Update PKGBUILD recipes

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  pages: write

jobs:
  update-recipes:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          # 1. Actualizar e instalar dependencias críticas del sistema (incluyendo github-cli)
          pacman -Syu --noconfirm --needed git pacman-contrib nvchecker python jq curl github-cli
          
          useradd --create-home builder

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare permissions
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Check upstream, update PKGBUILDs & create PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          [ -f oldver.json ] || echo '{}' > oldver.json
          nvchecker -c nvchecker.toml || true

          # Ejecutar script de actualización que crea ramas, PRs y las auto-aprueba
          runuser -u builder -- python3 ./.scripts/check-updates.py

          # Limpia fuentes temporales descargadas por updpkgsums
          git clean -fxd ./
