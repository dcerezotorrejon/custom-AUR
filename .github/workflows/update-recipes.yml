name: Update PKGBUILD recipes & Publish RPC

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update-recipes:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm git pacman-contrib nvchecker python jq curl
          useradd --create-home builder

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare permissions
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Check upstream, update PKGBUILDs & refresh .SRCINFO
        run: |
          set -Eeuo pipefail

          [ -f oldver.json ] || echo '{}' > oldver.json
          nvchecker -c nvchecker.toml || true

          # 1. Actualiza pkgver y recalcula hashes
          runuser -u builder -- python3 ./scripts/check-updates.py

          # 2. Auditoría con Namcap y generación de reporte en GitHub
          pacman -S --noconfirm namcap

          echo "## 🔍 Reporte de Auditoría de Recetas" >> $GITHUB_STEP_SUMMARY
          echo "| Paquete | Estado | Resultado / Detalles |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY

          HAS_ERRORS=0

          for pkgbuild in pkgs/*/PKGBUILD; do
            pkg_name=$(basename "$(dirname "$pkgbuild")")
            report=$(namcap "$pkgbuild" 2>&1 || true)

            if echo "$report" | grep -q "E:"; then
              clean_report=$(echo "$report" | tr '\n' '<br>' | sed 's/|/\\|/g')
              echo "| \`$pkg_name\` | ❌ **Error Crítico** | $clean_report |" >> $GITHUB_STEP_SUMMARY
              echo "::error file=$pkgbuild,title=Error crítico en $pkg_name::$report"
              HAS_ERRORS=1
            elif echo "$report" | grep -q "W:"; then
              clean_report=$(echo "$report" | tr '\n' '<br>' | sed 's/|/\\|/g')
              echo "| \`$pkg_name\` | ⚠️ **Advertencia** | $clean_report |" >> $GITHUB_STEP_SUMMARY
              echo "::warning file=$pkgbuild,title=Advertencia en $pkg_name::$report"
            else
              echo "| \`$pkg_name\` | ✅ **OK** | Sintaxis y dependencias válidas |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          if [ "$HAS_ERRORS" -eq 1 ]; then
            echo "::error::Se detectaron errores críticos de namcap en alguna receta. Cancelando commit."
            exit 1
          fi

          # 3. Limpia fuentes temporales descargadas por updpkgsums
          git clean -fxd pkgs/

          # 4. Regenera metadatos .SRCINFO
          runuser -u builder -- ./scripts/generate-srcinfo.sh

          if [ -f newver.json ] && [ -s newver.json ]; then
            mv newver.json oldver.json
          fi

          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Commit and push changes
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -Eeuo pipefail
          
          git add oldver.json
          while IFS= read -r -d '' file; do
            git add "$file"
          done < <(find pkgs \( -name PKGBUILD -o -name .SRCINFO \) -print0)

          if git diff --cached --quiet; then
            echo ":: No changes to commit."
          else
            git commit -m "auto: update PKGBUILD recipes"
            git push origin "HEAD:${DEFAULT_BRANCH}"
          fi