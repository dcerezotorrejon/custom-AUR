name: Update PKGBUILD recipes

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update-recipes:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm git pacman-contrib nvchecker python jq curl
          useradd --create-home builder

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare permissions
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Check upstream, update PKGBUILDs & refresh .SRCINFO
        run: |
          set -Eeuo pipefail

          [ -f oldver.json ] || echo '{}' > oldver.json
          nvchecker -c nvchecker.toml || true

          # 1. Actualiza pkgver y recalcula hashes
          runuser -u builder -- python3 ./.scripts/check-updates.py

          # 2. Auditoría con Namcap y generación de reporte en GitHub
          pacman -S --noconfirm namcap

          echo "## 🔍 Reporte de Auditoría de Recetas" >> $GITHUB_STEP_SUMMARY
          echo "| Paquete | Estado | Resultado / Detalles |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY

          HAS_ERRORS=0

          # MODIFICACIÓN 1: Cambiado 'pkgs/*/PKGBUILD' por '*/PKGBUILD'
          for pkgbuild in */PKGBUILD; do
            pkg_name=$(basename "$(dirname "$pkgbuild")")
            
            # FILTRO: Evita escanear carpetas del sistema si contienen PKGBUILDs por error
            if [[ "$pkg_name" == "scripts" || "$pkg_name" == "utils" ]]; then
              continue
            fi

            report=$(namcap "$pkgbuild" 2>&1 || true)

            if echo "$report" | grep -q "E:"; then
              clean_report=$(echo "$report" | tr '\n' '<br>' | sed 's/|/\\|/g')
              echo "| \`$pkg_name\` | ❌ **Error Crítico** | $clean_report |" >> $GITHUB_STEP_SUMMARY
              echo "::error file=$pkgbuild,title=Error crítico en $pkg_name::$report"
              HAS_ERRORS=1
            elif echo "$report" | grep -q "W:"; then
              clean_report=$(echo "$report" | tr '\n' '<br>' | sed 's/|/\\|/g')
              echo "| \`$pkg_name\` | ⚠️ **Advertencia** | $clean_report |" >> $GITHUB_STEP_SUMMARY
              echo "::warning file=$pkgbuild,title=Advertencia en $pkg_name::$report"
            else
              echo "| \`$pkg_name\` | ✅ **OK** | Sintaxis y dependencias válidas |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          if [ "$HAS_ERRORS" -eq 1 ]; then
            echo "::error::Se detectaron errores críticos de namcap en alguna receta. Cancelando commit."
            exit 1
          fi

          # MODIFICACIÓN 2: Evitamos hacer 'git clean' en todo el proyecto para no borrar scripts
          # Limpiamos archivos temporales carpeta por carpeta usando find a primer nivel
          while IFS= read -r -d '' src_dir; do
            git clean -fxd "$src_dir"
          done < <(find . -maxdepth 2 -mindepth 2 -name PKGBUILD -exec dirname {} \; -print0)

          # 4. Regenera metadatos .SRCINFO
          runuser -u builder -- ./.scripts/generate-srcinfo.sh

          if [ -f newver.json ] && [ -s newver.json ]; then
            mv newver.json oldver.json
          fi

          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Commit and push changes
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -Eeuo pipefail
          
          git add oldver.json
          
          # MODIFICACIÓN 3: Cambiado 'find pkgs' por 'find .' filtrando profundidad
          # para no añadir por accidente scripts u otros archivos de la raíz
          while IFS= read -r -d '' file; do
            git add "$file"
          done < <(find . -maxdepth 3 -mindepth 3 \( -name PKGBUILD -o -name .SRCINFO \) -print0)

          if git diff --cached --quiet; then
            echo ":: No changes to commit."
          else
            git commit -m "auto: update PKGBUILD recipes"
            git push origin "HEAD:${DEFAULT_BRANCH}"
          fi
